name: Coletar candidatos a evento

# Baixa páginas públicas das fontes e guarda o retrato na branch "coleta".
# Os candidatos são conferidos antes de entrar na agenda (data/eventos.json).
on:
  schedule:
    - cron: "0 10 * * 1,4"   # segundas e quintas, 7h em Salvador
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Coletar
        run: node scripts/coletar.mjs
      - name: Publicar na branch coleta
        run: |
          mkdir -p /tmp/saida && cp -r coleta /tmp/saida/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coleta-tmp
          git rm -rq --cached . && rm -rf ./*
          cp -r /tmp/saida/coleta .
          git add coleta
          git commit -qm "Coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin coleta-tmp:coleta
