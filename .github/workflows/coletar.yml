name: Coletar candidatos a evento

# Baixa páginas públicas das fontes e guarda o retrato na branch "coleta".
# Depois abre uma issue com os candidatos novos para conferência.
# Nada entra na agenda (data/eventos.json) sem ser conferido na página oficial.
on:
  schedule:
    - cron: "0 10 * * 1,4"   # segundas e quintas, 7h em Salvador
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Coletar
        timeout-minutes: 80
        continue-on-error: true
        run: node scripts/coletar.mjs
      - name: Listar candidatos novos
        if: always()
        run: node scripts/candidatos.mjs
      - name: Abrir issue com os candidatos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create coleta --color c4563b --description "Candidatos da coleta automática" 2>/dev/null || true
          gh issue create --title "Candidatos a evento — coleta de $(TZ=America/Bahia date +%d/%m/%Y)" --label coleta --body-file coleta/candidatos.md
      - name: Publicar na branch coleta
        if: always()
        run: |
          mkdir -p /tmp/saida && cp -r coleta /tmp/saida/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coleta-tmp
          git rm -rq --cached . && rm -rf ./*
          cp -r /tmp/saida/coleta .
          git add coleta
          git commit -qm "Coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin coleta-tmp:coleta
